# Orion-HQ — full deployment stack.
#
# Stateful services (postgres, minio, redis, keycloak) are also declared here
# so a single `docker compose up` brings up the whole HQ. Production requires
# secrets to be supplied via the environment (see app/config.py — the services
# fail closed unless ORIONHQ_ENV=production and real secrets are set).
#
# Usage:  docker compose -f docker/docker-compose.yml --env-file .env up -d
name: orionhq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORIONHQ_DB_USER:-orionhq}
      POSTGRES_PASSWORD: ${ORIONHQ_DB_PASSWORD:-orionhq}
      POSTGRES_DB: ${ORIONHQ_DB_NAME:-orionhq}
    volumes:
      - orionhq-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ORIONHQ_S3_ACCESS_KEY:-orionhq}
      MINIO_ROOT_PASSWORD: ${ORIONHQ_S3_SECRET_KEY:-orionhq-dev-secret}
    volumes:
      - orionhq-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &api-env
      ORIONHQ_ENV: ${ORIONHQ_ENV:-production}
      ORIONHQ_DATABASE_URL: postgresql+asyncpg://${ACADIAQ_DB_USER:-orionhq}:${ACADIAQ_DB_PASSWORD:-orionhq}@postgres:5432/${ACADIAQ_DB_NAME:-orionhq}
      ORIONHQ_REDIS_URL: redis://redis:6379/0
      ORIONHQ_S3_ENDPOINT_URL: http://minio:9000
      ORIONHQ_S3_ACCESS_KEY: ${ORIONHQ_S3_ACCESS_KEY:-orionhq}
      ORIONHQ_S3_SECRET_KEY: ${ORIONHQ_S3_SECRET_KEY:-orionhq-dev-secret}
      ORIONHQ_S3_BUCKET: ${ORIONHQ_S3_BUCKET:-orionhq}
      ORIONHQ_OIDC_ISSUER: ${ORIONHQ_OIDC_ISSUER:?set ORIONHQ_OIDC_ISSUER}
      ORIONHQ_OIDC_CLIENT_ID: ${ORIONHQ_OIDC_CLIENT_ID:-orionhq-api}
      ORIONHQ_OIDC_CLIENT_SECRET: ${ORIONHQ_OIDC_CLIENT_SECRET:?set ORIONHQ_OIDC_CLIENT_SECRET}
      ORIONHQ_SESSION_SECRET_KEY: ${ORIONHQ_SESSION_SECRET_KEY:?set ORIONHQ_SESSION_SECRET_KEY}
      ORIONHQ_CORS_ALLOW_ORIGINS: ${ORIONHQ_CORS_ALLOW_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${ORIONHQ_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m gateway.server
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ORIONHQ_GATEWAY_PORT:-50051}:50051"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${ORIONHQ_WEB_PORT:-8080}:80"

volumes:
  orionhq-pg-data:
  orionhq-minio-data:
